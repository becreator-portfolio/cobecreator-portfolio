name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Audit media handoff
        shell: bash
        run: |
          missing=0
          for asset in \
            hero.mp4 \
            hero-poster.jpg \
            block-office.mp4 \
            block-office-poster.jpg \
            nos-contra-o-mundo.mp4 \
            nos-contra-o-mundo-poster.jpg \
            peso-da-historia.mp4 \
            peso-da-historia-poster.jpg
          do
            if [ ! -f "public/media/$asset" ]; then
              echo "::warning file=public/media/$asset::Missing production media asset"
              missing=$((missing + 1))
            fi
          done
          echo "Missing media assets: $missing"

      - name: Build
        run: npm run build
